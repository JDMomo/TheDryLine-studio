<!doctype html><meta charset="utf-8"><title>The Dry Line — Line-Art Lab v3</title><style>body{margin:0;background:#171a1c;color:#eee;font:14px Georgia}aside{position:fixed;width:255px;top:0;bottom:0;padding:16px;background:#202421;overflow:auto}main{margin-left:285px;padding:18px}canvas{background:#e8dfc8;max-width:100%;height:auto}label{display:block;margin:10px 0}input,select,button{width:100%;font-size:16px}</style><aside><h2>LINE-ART LAB v3</h2><p>Shipping-gate renderer. Strokes only, seeded, no dependencies.</p><label>Character<select id="who"><option>wanderer</option><option>strider</option><option>gearling</option></select></label><label>Palette<select id="pal"><option>base</option><option>r1</option><option>r3</option><option>r4</option></select></label><label>Density<input id="density" type="range" min=".7" max="1.4" step=".05" value="1"></label><label>Line boil<input id="boil" type="range" min="0" max=".5" step=".05" value=".15"></label><label>Seed<input id="seed" value="27182"></label><button id="reroll">Re-roll</button><p id="m"></p><p><a href="compare.html">Painted comparison</a> · <a href="coverage.html">Day-2 coverage</a></p></aside><main><canvas id="c" width="960" height="720"></canvas></main><script src="engine_v3.js"></script><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),$=q=>document.querySelector(q);let tick=0;function draw(){let t=performance.now(),id=$('#who').value,p=$('#pal').value,d=+$ ('#density').value,b=+$ ('#boil').value,s=$('#seed').value;x.fillStyle=G.lineartV3.palettes[p].paper;x.fillRect(0,0,c.width,c.height);x.fillStyle='#171b1c';x.font='14px Georgia';x.fillText(id.toUpperCase()+' — 1x / 4x / motion / palette',30,30);G.lineartV3.render(x,id,100,140,1,0,p,{density:d,boil:b,tick,seed:s});G.lineartV3.render(x,id,330,260,4,0,p,{density:d,boil:b,tick,seed:s});let sp=G.lineartV3.specs[id];for(let f=0;f<sp.frames;f++)G.lineartV3.render(x,id,70+f*90,560,1,f,p,{density:d,boil:0,tick:0,seed:s});G.lineartV3.render(x,id,760,230,2,0,'r1',{density:d,boil:b,tick,seed:s});G.lineartV3.render(x,id,860,230,2,0,'r3',{density:d,boil:b,tick,seed:s});let q=G.lineartV3.bake(id,p,s,{density:d,boil:0});$('#m').textContent='bake '+q.ms.toFixed(1)+' ms · '+(q.bytes/1048576).toFixed(2)+' MiB raw';}for(const e of document.querySelectorAll('input,select'))e.addEventListener('input',()=>{tick++;draw()});$('#reroll').onclick=()=>{$('#seed').value=String((Math.random()*1e9)|0);draw()};draw();
</script>
