<!doctype html><meta charset="utf-8"><title>The Dry Line — Line-Art Lab</title><style>body{margin:0;background:#171a1c;color:#eee;font:14px Georgia}aside{position:fixed;width:240px;top:0;bottom:0;padding:16px;background:#202421}main{margin-left:272px;padding:18px}canvas{background:#ddd2b7;max-width:100%}label{display:block;margin:9px 0}input,select{width:100%}</style><aside><h2>LINE-ART LAB</h2><label>Character<select id="who"><option>wanderer</option><option>strider</option><option>gearling</option></select></label><label>Stroke count<input id="count" type="range" min="300" max="2600" value="1550"></label><label>Length<input id="len" type="range" min="2" max="9" step=".1" value="5.4"></label><label>Width<input id="wid" type="range" min=".4" max="1.7" step=".05" value=".87"></label><label>Density<input id="dens" type="range" min=".5" max="2.8" step=".1" value="1.8"></label><label>Hatch bend<input id="bend" type="range" min="0" max="1" step=".05" value=".6"></label><label>Palette<select id="pal"><option>base</option><option>r1</option><option>r3</option></select></label><label>Jitter<input id="jitter" type="range" min="0" max="18" value="4"></label><label>Boil<input id="boil" type="range" min="0" max="1" step=".05" value=".15"></label><label>Seed<input id="seed" value="27182"></label><p id="metric"></p></aside><main><canvas id="c" width="960" height="720"></canvas></main><script src="lineart.js"></script>
